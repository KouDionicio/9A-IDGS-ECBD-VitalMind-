services:
  vitalmind-frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:4000/api}
        VITE_SOCKET_URL: ${VITE_SOCKET_URL:-http://localhost:4000}
        VITE_ML_API_URL: ${VITE_ML_API_URL:-http://localhost:8000/api/v1}
    container_name: vitalmind-frontend
    ports:
      - "8080:80"
    restart: unless-stopped
