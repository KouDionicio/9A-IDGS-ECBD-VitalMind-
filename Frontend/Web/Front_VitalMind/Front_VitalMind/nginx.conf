server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Healthcheck del contenedor.
  location = /health {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  # SPA: permite recargar cualquier ruta de React Router.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # No cachear index.html para evitar que una versión vieja del frontend
  # apunte a bundles que ya no existen.
  location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
  }

  # Los assets versionados de Vite sí pueden cachearse.
  location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|webp|woff|woff2|ttf|eot)$ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800, immutable";
    try_files $uri =404;
  }
}
